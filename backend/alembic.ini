# A generic, single database configuration for Alembic

[alembic]
script_location = backend/alembic
prepend_sys_path = .
version_path_separator = os

# MANDATORY: DATABASE_URL must be set as an environment variable before running
# any Alembic command (e.g. alembic upgrade head, alembic revision --autogenerate).
# The runtime override in backend/alembic/env.py reads settings.DATABASE_URL and
# sets it on the Alembic config. Do NOT hardcode a URL here — it will be ignored
# at runtime but could mislead developers or be used by tools that bypass env.py.
# Example (set in shell before running alembic):
#   $env:DATABASE_URL = "postgresql+psycopg://oliver_app_user:<pass>@localhost:5432/oliver_db"
# sqlalchemy.url is intentionally left unset.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

